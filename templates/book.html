<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Termin buchen</title>
  <style>
    :root { font-family: Inter, Arial, sans-serif; background: #f5f7f2; color: #142018; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(680px, 100%); background: #fff; border: 1px solid #dce7d8; border-radius: 8px; padding: 24px; box-shadow: 0 14px 40px rgba(20, 50, 25, .08); }
    h1 { margin-top: 0; letter-spacing: 0; }
    a { color: #1d6f42; font-weight: 900; }
  </style>
</head>
<body>
  <main>
    <h1>Termin für {{ lead.name }} buchen</h1>
    <p>Demo-Link für Lead {{ lead_id }}. In Production wird hier Google Calendar oder Calendly eingebunden.</p>
    <p><a href="/demo/{{ lead_id }}">Zur Demo und zum Angebotsentwurf</a></p>
  </main>
</body>
</html>
