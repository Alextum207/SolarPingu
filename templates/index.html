<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolarPingu - Solar-Erstgespräch</title>
  <style>
    :root {
      font-family: Inter, Arial, sans-serif;
      color: #17201a;
      background: #f5f7f2;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }
    main {
      width: min(760px, 100%);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 6vw, 56px);
      line-height: 1.02;
      letter-spacing: 0;
    }
    p {
      color: #4e5f52;
      font-size: 17px;
      line-height: 1.5;
      margin: 0 0 22px;
    }
    form {
      background: #fff;
      border: 1px solid #dde7d9;
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(20, 50, 25, .08);
      display: grid;
      gap: 16px;
      padding: 24px;
    }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    label {
      display: grid;
      gap: 7px;
      font-size: 14px;
      font-weight: 800;
    }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ccd8c7;
      border-radius: 6px;
      padding: 12px 13px;
      font: inherit;
      color: #17201a;
      background: #fff;
    }
    textarea {
      min-height: 92px;
      resize: vertical;
    }
    button {
      border: 0;
      border-radius: 6px;
      background: #1d6f42;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 16px;
      font-weight: 900;
      padding: 14px 18px;
    }
    button:disabled {
      background: #98a69c;
      cursor: not-allowed;
    }
    .notice, .error {
      border-radius: 6px;
      margin-bottom: 16px;
      padding: 12px 14px;
    }
    .notice {
      background: #edf6ec;
      border: 1px solid #c9dec5;
      color: #295b2e;
    }
    .error {
      background: #fff0f0;
      border: 1px solid #efc0c0;
      color: #9b2222;
    }
    @media (max-width: 680px) {
      body { padding: 18px; }
      form { padding: 18px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Solar-Erstgespräch buchen</h1>
    <p>Wähle einen freien Termin. Agent 1 bereitet danach den kurzen Qualifikationsanruf vor.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    {% if not calendar_configured %}
      <div class="notice">Lokaler Modus: Google Calendar ist noch nicht konfiguriert. Termine werden lokal simuliert.</div>
    {% endif %}

    <form action="/leads" method="post">
      <div class="grid">
        <label>Name
          <input name="name" autocomplete="name" required>
        </label>
        <label>E-Mail
          <input name="email" type="email" autocomplete="email" required>
        </label>
      </div>
      <div class="grid">
        <label>Telefonnummer
          <input name="phone" type="tel" autocomplete="tel" required>
        </label>
        <label>Freier Termin
          <select name="preferred_slot" required>
            {% for slot in slots %}
              <option value="{{ slot.value }}">{{ slot.label }}</option>
            {% else %}
              <option value="">Keine freien Termine gefunden</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <label>Adresse des Objekts
        <input name="address" autocomplete="street-address" placeholder="Straße, PLZ Ort">
      </label>
      <label>Kurze Notiz
        <textarea name="message" placeholder="z. B. Dachtyp, Stromverbrauch, Speicherinteresse"></textarea>
      </label>
      <button type="submit" {% if not slots %}disabled{% endif %}>Termin anfragen</button>
    </form>
  </main>
</body>
</html>
