<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Termin reserviert</title>
  <style>
    :root { font-family: Inter, Arial, sans-serif; color: #17201a; background: #f5f7f2; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; }
    main { width: min(760px, 100%); background: #fff; border: 1px solid #dde7d9; border-radius: 8px; padding: 26px; box-shadow: 0 18px 50px rgba(20, 50, 25, .08); }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 48px); line-height: 1.05; letter-spacing: 0; }
    p { color: #4e5f52; font-size: 17px; line-height: 1.5; }
    dl { display: grid; grid-template-columns: 160px 1fr; gap: 10px 16px; margin: 22px 0; }
    dt { font-weight: 900; }
    dd { margin: 0; overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; background: #f1f5ee; border: 1px solid #dbe6d8; border-radius: 6px; padding: 14px; overflow-x: auto; }
    a { color: #1d6f42; font-weight: 800; }
    @media (max-width: 640px) { dl { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Termin reserviert</h1>
    <p>Agent 1 hat den Lead gespeichert und den Call-Plan vorbereitet.</p>
    <dl>
      <dt>Lead-ID</dt>
      <dd>{{ lead.lead_id }}</dd>
      <dt>Name</dt>
      <dd>{{ lead.name }}</dd>
      <dt>Termin</dt>
      <dd>{{ lead.selected_slot_start }}</dd>
      <dt>Status</dt>
      <dd>{{ lead.status }}</dd>
    </dl>
    <h2>Call-Plan</h2>
    <pre>{{ call_plan | tojson(indent=2) }}</pre>
    <p><a href="/">Weiteren Termin buchen</a></p>
  </main>
</body>
</html>
